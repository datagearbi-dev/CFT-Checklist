<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CFT Implementation Checklist</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <style>
:root{--bg:#f7f8fc;--sidebar:#fff;--card:#fff;--border:#e2e5f0;--border2:#c8ccde;--text:#1a1d2e;--text2:#6b7094;--text3:#9ca3c0;--active-bg:#E6F1FB;--active-text:#185FA5;--input-bg:#fff;--modal-bg:#fff;--drag-bg:#EBF4FF;--progress-bg:#eef0f7;--section-bg:#f7f8fc;--btn-sec:#f0f2f8;--btn-sec-text:#6b7094;--shadow:0 2px 12px rgba(0,0,0,.08)}
[data-theme=dark]{--bg:#0f1117;--sidebar:#161b2e;--card:#1e2235;--border:#2a2f4a;--border2:#3d4466;--text:#e2e6f0;--text2:#8b90b8;--text3:#555a7a;--active-bg:#1a2a45;--active-text:#5ba3f5;--input-bg:#1e2235;--modal-bg:#1e2235;--drag-bg:#1a2a45;--progress-bg:#2a2f4a;--section-bg:#161b2e;--btn-sec:#252a40;--btn-sec-text:#8b90b8;--shadow:0 2px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:248px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{height:54px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-logo-icon{width:30px;height:30px;border-radius:8px;background:#185FA5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.sb-logo-text{font-weight:700;font-size:13px;color:var(--text);line-height:1.3}
.sb-nav{flex:1;overflow-y:auto;padding:8px}
.sb-label{font-size:10px;font-weight:700;color:var(--text3);padding:10px 8px 4px;text-transform:uppercase;letter-spacing:.07em}
.sb-btn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:7px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:12px;text-align:left;transition:all .12s}
.sb-btn:hover{background:var(--btn-sec);color:var(--text)}
.sb-btn.active{background:var(--active-bg);color:var(--active-text);font-weight:600}
.sb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sb-pct{margin-left:auto;font-size:10px;opacity:.7;flex-shrink:0}
.sb-footer{padding:8px;border-top:1px solid var(--border);flex-shrink:0}
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:54px;background:var(--sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
.header-search{flex:1;max-width:400px;position:relative}
.header-search input{width:100%;height:32px;padding:0 10px 0 30px;border:1px solid var(--border2);border-radius:7px;background:var(--input-bg);color:var(--text);font-size:12px;outline:none}
.header-search input:focus{border-color:#378ADD}
.header-search i{position:absolute;left:8px;top:8px;font-size:15px;color:var(--text3)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border2);background:var(--btn-sec);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .12s}
.icon-btn:hover{background:var(--input-bg);color:var(--text)}
.main{flex:1;overflow-y:auto;padding:24px 28px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.stat-val{font-size:22px;font-weight:700}
.pbar{height:5px;background:var(--progress-bg);border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.mod-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.sec{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
.sec-hdr{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;transition:background .12s;user-select:none}
.sec-hdr:hover{background:var(--section-bg)}
.sec-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.sec-title{font-weight:600;font-size:13px;color:var(--text);flex:1}
.sec-meta{font-size:11px;color:var(--text2)}
.sec-add-btn{display:flex;align-items:center;gap:3px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid transparent;cursor:pointer;background:transparent;margin-right:4px}
.sec-chev{font-size:12px;color:var(--text3);transition:transform .2s;margin-left:4px}
.sec-chev.open{transform:rotate(180deg)}
.sec-body{display:none;border-top:1px solid var(--border)}
.sec-body.open{display:block}
.sec-inner{padding:10px 12px}
.task-item{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--card);margin-bottom:5px;transition:border-color .12s}
.task-item:hover{border-color:var(--border2)}
.task-item.dragging{opacity:.35}
.task-item.drag-over{border-color:#185FA5;border-style:dashed;background:var(--drag-bg)}
.task-item.checked .task-text{text-decoration:line-through;color:var(--text3)}
.task-item.checked{opacity:.6}
.drag-grip{color:var(--text3);cursor:grab;flex-shrink:0;margin-top:2px;font-size:13px}
.task-check{cursor:pointer;flex-shrink:0;margin-top:2px;width:14px;height:14px;accent-color:#185FA5}
.task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.task-text{flex:1;font-size:12.5px;line-height:1.5;color:var(--text);word-break:break-word}
.task-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.task-actions{display:flex;gap:3px;flex-shrink:0;opacity:0;transition:opacity .12s}
.task-item:hover .task-actions{opacity:1}
.task-act-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
.task-act-btn:hover{background:var(--btn-sec);color:var(--text)}
.task-act-btn.del:hover{background:#FCEBEB;color:#A32D2D;border-color:#F09595}
.inline-form{border:1.5px solid var(--border2);border-radius:8px;overflow:hidden;background:var(--card);margin-top:6px}
.inline-form textarea{width:100%;padding:8px 10px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);font-size:12.5px;outline:none;resize:none;min-height:64px;line-height:1.5;font-family:inherit}
.inline-form-row{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--section-bg);flex-wrap:wrap}
.prio-btn{padding:3px 9px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid transparent;cursor:pointer}
.form-save{padding:5px 14px;border-radius:6px;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;margin-left:auto}
.form-cancel{padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer}
.add-trigger{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:6px;padding:6px;border:1px dashed var(--border2);border-radius:7px;cursor:pointer;color:var(--text3);font-size:12px;background:transparent;width:100%}
.add-trigger:hover{border-color:#185FA5;color:#185FA5;background:var(--active-bg)}
.modal-overlay{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--modal-bg);border:1px solid var(--border);border-radius:12px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:700;color:var(--text)}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:5px}
.modal-close:hover{background:var(--btn-sec)}
.modal-body{padding:20px}
.field-label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.field-input{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border2);background:var(--input-bg);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.field-input:focus{border-color:#185FA5}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:transform .1s;border:2px solid transparent;display:inline-block}
.color-swatch.selected{border-color:var(--text);transform:scale(1.15)}
.icon-opt{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2)}
.icon-opt.selected{border-color:#185FA5;background:#E6F1FB;color:#185FA5}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:15px 20px;border-top:1px solid var(--border)}
.btn-primary{padding:8px 20px;border-radius:7px;border:none;background:#185FA5;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn-secondary{padding:8px 16px;border-radius:7px;border:1px solid var(--border);background:var(--btn-sec);color:var(--text);font-size:13px;cursor:pointer}
.btn-danger{padding:8px 18px;border-radius:7px;border:none;background:#E24B4A;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.clear-btn{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;border:1px solid var(--border2);background:var(--btn-sec);color:var(--btn-sec-text);cursor:pointer;font-size:12px;font-weight:500}
.clear-btn:hover{background:#FAEEDA;color:#854F0B;border-color:#EF9F27}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;min-width:200px;max-width:340px;box-shadow:0 4px 16px rgba(0,0,0,.15);opacity:1;transition:opacity .3s}
.toast.success{background:#185FA5;color:#fff}
.toast.error{background:#E24B4A;color:#fff}
.sr-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;margin-bottom:6px}
.sr-item:hover{border-color:var(--border2)}
mark{background:#fff3a0;color:#6b4c00;border-radius:2px;padding:0 2px}
[data-theme=dark] mark{background:#5a4a00;color:#ffe066}
.login-screen{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.progress-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:20px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(max-width:700px){.sidebar{width:200px}.stat-grid{grid-template-columns:1fr 1fr}.mod-grid{grid-template-columns:1fr}.main{padding:16px}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
  </head>
  <body>

    <!-- LOGIN -->
    <div class="login-screen" id="loginScreen">
      <div style="width:100%;max-width:420px">
        <div style="text-align:center;margin-bottom:28px">
          <div
            style="width:56px;height:56px;border-radius:14px;background:#185FA5;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px;color:#fff"><i
              class="ti ti-shield-check"></i></div>
          <h1
            style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px">CFT
            Implementation Checklist</h1>
          <p style="font-size:13px;color:var(--text2)">Select your user to
            continue</p>
        </div>
        <div
          style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px">
          <p
            style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">SELECT
            USER</p>
          <div id="userListArea"></div>
        </div>
        <div
          style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px">
          <p
            style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:5px">ADD
            NEW USER</p>
          <p id="addUserHint"
            style="font-size:11px;color:var(--text2);margin-bottom:10px">First
            user will be Admin with full access.</p>
          <div style="display:flex;gap:8px">
            <input id="newUserInput" class="field-input"
              placeholder="Enter your name..." />
            <button id="addUserBtn"
              style="padding:8px 14px;border-radius:7px;border:none;background:#185FA5;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap"><i
                class="ti ti-plus"></i> Add</button>
          </div>
        </div>
        <div style="text-align:center;margin-top:14px">
          <button id="themeBtnLogin"
            style="background:none;border:1px solid var(--border);border-radius:7px;padding:6px 14px;color:var(--text2);cursor:pointer;font-size:12px">
            <i id="themeIconLogin" class="ti ti-moon"></i> Toggle theme
          </button>
        </div>
      </div>
    </div>

    <!-- APP -->
    <div id="appShell" style="display:none;width:100%;height:100vh">
      <div class="app">
        <aside class="sidebar">
          <div class="sb-logo">
            <div class="sb-logo-icon"><i class="ti ti-shield-check"></i></div>
            <span class="sb-logo-text">CFT Implementation Checklist</span>
          </div>
          <div class="sb-nav" id="sbNav"></div>
          <div class="sb-footer" id="sbFooter"></div>
        </aside>
        <div class="main-wrap">
          <header class="header">
            <div class="header-search"><i class="ti ti-search"></i><input
                type="text" id="searchInput"
                placeholder="Search checklist items..." /></div>
            <div class="header-right">
              <div
                style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)">
                <div id="syncDot"
                  style="width:8px;height:8px;border-radius:50%;background:#f59e0b;flex-shrink:0;animation:pulse 2s infinite"></div>
                <span style="font-size:10px">Sync</span>
              </div>
              <button id="clearBtn" class="clear-btn" style="display:none"><i
                  class="ti ti-square-check" style="font-size:14px"></i><span
                  id="clearBtnLabel">Clear Checks</span></button>
              <button id="themeBtn" class="icon-btn"
                title="Toggle dark/light mode"><i id="themeIcon"
                  class="ti ti-moon"></i></button>
              <span id="userBadge"
                style="font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;background:#E9E7F7;color:#4B3FAA">-</span>
              <div id="userAvatar"
                style="width:32px;height:32px;border-radius:50%;background:#185FA5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer"
                title="Switch user">?</div>
            </div>
          </header>
          <main id="mainContent" class="main"></main>
        </div>
      </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

var ORIGINAL_DATA = [
  {id:"prereq",name:"Pre-requisites",icon:"ti-server",color:"#185FA5",bg:"#E6F1FB",order:0,tasks:[
    {id:"prereq_t0",text:"Tomcats to be ready (java space......)in both WEB/ Compute",priority:"critical",order:0},
    {id:"prereq_t1",text:"Java version to be as the uat in both WEB/ Compute",priority:"critical",order:1},
    {id:"prereq_t2",text:"Cretificates to be as the uat (all compute and web can reach each other, also jobs like watchers to access the correct cretificates)",priority:"minor",order:2},
    {id:"prereq_t3",text:"Import all roles and privillge from UAT DG UM to prod DG UM",priority:"critical",order:3},
    {id:"prereq_t4",text:"DG UM to be up and running",priority:"critical",order:4},
    {id:"prereq_t5",text:"ECM to be up and running",priority:"critical",order:5},
    {id:"prereq_t6",text:"Active mq to be up and running",priority:"critical",order:6},
    {id:"prereq_t7",text:"dg-flow to be up and running (import all workflows from UAT publish them)",priority:"critical",order:7},
    {id:"prereq_t8",text:"Get all cases defintions from UAT DGCMGMT DB",priority:"minor",order:8},
    {id:"prereq_t9",text:"Ensure that CRP is up and running to enable onboarding/ KYC integration",priority:"critical",order:9},
    {id:"prereq_t10",text:"PKG in Compute server",priority:"minor",order:10},
    {id:"prereq_t11",text:"Take all PKG from UAT (upgrade version) compute server (DG_SNCT, apps, Jobs \u2026\u2026)",priority:"minor",order:11},
    {id:"prereq_t12",text:"PKG in WEB server",priority:"minor",order:12},
    {id:"prereq_t13",text:"Take CFT UI app from UAT (upgrade version) WEB server",priority:"minor",order:13},
    {id:"prereq_t14",text:"Activities in Prod",priority:"minor",order:14},
    {id:"prereq_t15",text:"Ensure that the Infra team deploys the correct package, which is currently implemented and validated in the UAT environment.",priority:"critical",order:15},
    {id:"prereq_t16",text:"Ensure that the java space used in both CFT tomcats are reasonable",priority:"critical",order:16},
    {id:"prereq_t17",text:"Ensure that Entity_watch_list_dim and FSC_PARTY_DIM tables have data and FSC_STAKEHOLDER \"if any\"",priority:"critical",order:17},
    {id:"prereq_t18",text:"Ensure that Entity_watch_list_dim and snct_lookup have same data type and size, and ensure that all records that have DOB have YOB",priority:"critical",order:18},
    {id:"prereq_t19",text:"Run wluj, ensure data moved successfully with no issues",priority:"critical",order:19},
    {id:"prereq_t20",text:"Ensure that FSC_PARTY_DIM and party_household have same data type and size, and ensure that all records have DOB have YOB",priority:"critical",order:20},
    {id:"prereq_t21",text:"Run phuj ensure data moved successfully with no issues",priority:"critical",order:21},
    {id:"prereq_t22",text:"Configure all the apps, services and jobs that are found in prod env \"in Compute and WEB servers\"",priority:"critical",order:22},
    {id:"prereq_t23",text:"Ensure if CFT engine is running or not \"check the wsdl\"",priority:"major",order:23},
    {id:"prereq_t24",text:"Prepare the needed path for database connections, logs, backup folders",priority:"minor",order:24},
    {id:"prereq_t25",text:"Create a user in DG UM and give it all needed privillges",priority:"critical",order:25},
    {id:"prereq_t26",text:"ECM/CFT UI integration from ECM settings in External Apps",priority:"critical",order:26},
    {id:"prereq_t27",text:"Ensure that CFT UI accessiable, side bar have all needed modules",priority:"critical",order:27},
    {id:"prereq_t28",text:"Ensure the workflows are found and linked with correct modules",priority:"critical",order:28},
    {id:"prereq_t29",text:"Ensure the ecm settings (case types, case statuses) are found and correct, remove unneeded case types, ensure all coulmns are main columns)",priority:"critical",order:29},
    {id:"prereq_t30",text:"Send a web request from the CFT UI and ensure if it will create case (to ensure that cft ui can reach the engine), report, workflow visible inside the case",priority:"critical",order:30},
    {id:"prereq_t31",text:"Check if modules' settings working and creating cases",priority:"major",order:31},
    {id:"prereq_t32",text:"Delete all created cases",priority:"minor",order:32},
    {id:"prereq_t33",text:"Prepare the cft jobs batch files and include them in ETL batch.",priority:"minor",order:33},
    {id:"prereq_t34",text:"If there are watchers (ACH, SWIFT, ISO) create a service for each watcher, ensure that the service run on same Java version as in UAT",priority:"critical",order:34},
    {id:"prereq_t35",text:"If there is a SWIFT module implement then run BICS loader, MT loader, ensure the related tables are found and full of data (mt , field , mt_field, BICS_LOOKUP , snct_currency_lkp , snct_country_lkp)",priority:"critical",order:35},
    {id:"prereq_t36",text:"If there is a SWIFT module implement then run MT loader, ensure the related tables are found and full of data (mt , field , mt_field)",priority:"critical",order:36},
    {id:"prereq_t37",text:"If there is an ISO module implement and run BICS loader, MX loader, ensure the related tables are found and full of data (BICS_LOOKUP , snct_currency_lkp , snct_country_lkp , Messagedefinition , Message_elements , Xmltaglookup , Element , Complextype , BusinessArea)",priority:"critical",order:37},
    {id:"prereq_t38",text:"If there is an ISO module implement and run MX loader, ensure the related tables are found and full of data (Messagedefinition , Message_elements , Xmltaglookup , Element , Complextype , BusinessArea)",priority:"critical",order:38},
    {id:"prereq_t39",text:"If there is an ACH module implement and run BICS loader, ensure the related tables are found and full of data (BICS_LOOKUP , snct_currency_lkp , snct_country_lkp)",priority:"critical",order:39},
    {id:"prereq_t40",text:"Ensure if there are specific Library needed like in FIB bank \"orai18n-19.3.0.0.jar\"",priority:"major",order:40},
    {id:"prereq_t41",text:"Ensure that cft modules' settings (matching level and lists) are the same of old Production \"this for clients have old cft production but if there is not please set matching level to High as default value and check on all lists\"",priority:"critical",order:41},
    {id:"prereq_t42",text:"Ensure that SWIFT MT fields are the same of ones in old production (checked, unchecked)",priority:"critical",order:42},
    {id:"prereq_t43",text:"Ensure that SWIFT MX fields are the required ones (there are screens show that) as ones in MIDB prod",priority:"critical",order:43},
    {id:"prereq_t44",text:"Make sure the search limit to 500 in the engine configuration file, if not mentioned otherwise",priority:"major",order:44},
    {id:"prereq_t45",text:"Make sure that the screening rules on Production server, are correct like done on UAT environment",priority:"critical",order:45},
    {id:"prereq_t46",text:"If we used in UAT differnet DB name like in FIB \"DGCMGMT_NEW \". In production the DGCMGMT DB will be DGCMGT NOT DGCMGMT_NEW So we will need to edit: 1- the stored prosedures of daily1 , daily1 pep in dgcftcore 2- insert whitelist, create whitelist in dgcft 3- the cft ui app in web server 4- the sanction service app",priority:"critical",order:46},
    {id:"prereq_t47",text:"Edit the users used by the client through DG UM in production \"We need to give each one the right privilleges, according to the list bank provided or reference to old production\"",priority:"critical",order:47}
  ]},

    {id:"delta_t0",text:"Ensure that engine is implemented correctly \"DB config, log file path, active mq queue name, hostname and port\" and working fine",priority:"critical",order:0},

    {id:"delta_t3",text:"Ensure that it is running on the correct java version",priority:"critical",order:3},

    {id:"delta_t5",text:"Make sure in the UI Delta section, the matching level is set HIGH \"default\" and that the lists are found in the list management as found in table SNCT_LOOKUP \"watchlist_name column\"",priority:"critical",order:5},
    {id:"delta_t6",text:"Before the run make sure that the data looks normal and that there is no issues like Year of birth is extracted from date of birth.",priority:"critical",order:6},
    {id:"delta_t7",text:"Make sure the columns SCREENING_DATE, RESULT, ERROR_DESC are found in both tables, FSC_ENTITY_WATCHLIST_DIM and FSC_PARTY_DIM",priority:"critical",order:7},
    {id:"delta_t8",text:"Run the Delta job and check if it prints the log correctly",priority:"major",order:8},
    {id:"delta_t9",text:"Check if the request is saved in dbo.request details table and dbo.message",priority:"major",order:9},
    {id:"delta_t10",text:"Check if the data appeared in the case in UI is the similar of that found in case_live table",priority:"major",order:10},
    {id:"delta_t11",text:"Check the logs \"engine, tomcat, job\" if it contains issue or not, if no case creation occurred or failure in any record while running the job",priority:"critical",order:11},
    {id:"delta_t12",text:"Ensure that the batch file has the right path of the jobs",priority:"critical",order:12},
    {id:"delta_t13",text:"For Daily1 make sure that the table \"FSC_DAILY1_PARTY_MATCHES\" and empty before running daily1 job to avoid any case creation issue is found in DGCFTWL db/ DGCFTCORE",priority:"critical",order:13},
    {id:"delta_t14",text:"For Daily1 make sure that the stored procedure \"DAILY1_CASE_CREATION_PROC\" is found in DGCFTWL db/ DGCFTCORE",priority:"critical",order:14},
    {id:"delta_t15",text:"\"Only if the used DB is Oracle check if this table \"\"TOP_COLUMN_NAME\"\" is found and has those columns (\"\"PARTY_KEY\"\" , \"\"MATCH_TYPE\"\", \"\"INCIDENT_VAL\"\" , \"\"COLUMN_NAME\"\", \"\"STAKEHOLDER_KEY\"\" , \"\"ROWNO\"\" )\"",priority:"critical",order:15},
    {id:"delta_t16",text:"For Daily1 make sure that all functions are found in DGCFTWL db/ DGCFTCORE \"getAliases getConrel getEntityWatchListRemarks getKeyDelta getKeyWords getMatchingLevel getNameAndCategoryFromWchk getPartyRemarks getPEPStakeholderPartyRemarks (for daily1 pep) getStakeholderPartyRemarks splitString\"",priority:"critical",order:16},
    {id:"delta_t17",text:"Check the case, If the wf works or not ,Transaction body and if the incidents are highlighted or not , Incidents and their matches, check remarks, further info, aliases, connection relationship \"still not available\", sources, key words, key data ,Case attachment ,Comments ,Case history.",priority:"major",order:17},
    {id:"delta_t18",text:"Make sure if there is any condition to be added in the Daily2 job \"ex:like party_status_desc <>'Closed',....\" and in Daily1 job \"ex: type_desc not in ('INDIVIDUAL','ORGANIZATION','OTHER')\"",priority:"critical",order:18},
    {id:"delta_t19",text:"Make sure that the columns \"case description, rim number, and customer full name\" are shown in the ecm in order for data to be shown. Also found in the search criteria so that the client can use them while filtering",priority:"critical",order:19},
    {id:"delta_t20",text:"Make sure that the party number gets saved in COL2 in case_live in both daily1 and daily2",priority:"critical",order:20},
    {id:"delta_t21",text:"Make sure that the screening roles are implemented just like the BRD",priority:"critical",order:21},
    {id:"delta_t22",text:"Check that the workflow is working fine",priority:"critical",order:22}
  ]},

  {id:"swiftmt",name:"SWIFT-MT Watcher",icon:"ti-arrows-exchange",color:"#0F6E56",bg:"#E1F5EE",order:5,tasks:[
    {id:"swiftmt_t0",text:"Ensure that engine \"preferably separate tomcat for engine without certificate to avoid any network issues\" is working fine",priority:"critical",order:0},
    {id:"swiftmt_t1",text:"Ensure that Swift MT watcher is implemented correctly \"DB config, logs path and job path, wsdl of engine\"",priority:"critical",order:1},
    {id:"swiftmt_t2",text:"Make sure that Bic_Loader job gets run",priority:"critical",order:2},
    {id:"swiftmt_t3",text:"Make sure that FileMover job is found to take samples to be copied in another folder for watcher to screen \"will work on sample till all transactions in the main folder cleared\"",priority:"critical",order:3},
    {id:"swiftmt_t4",text:"Make sure that MT-Loader job gets run, 1- Check if \"mt\", \"field\", \"mt_field\" tables are found in DGCFT DB or not 2- Check if folder (MTs_Files )is found or not in the correct path of this job (we put here the files that this job work on it) 3- Check configuation files \"config.properties\" that contains db connections, folder's path and \" log4j.proprties\" that has the log path are correct or not 4- If oracle : run 2 queries in sql developer \"MT_NO_TAGS table script\" \"NO_TAGS_MT_FIELDS table script\" u will find them in \"ORACLE_config_reference.properties\" file inside resources folder in mt loader jar 5- If sql: no need to run those 2 queries just run job 6- Truncate the 3 tables if we are in UAT environment 7- Run the MT_loader as any job \"java -jar name of job\" then check log file 8- Check if the tables are full with data or not and no issues in logs",priority:"critical",order:4},
    {id:"swiftmt_t5",text:"Ensure that it is running on the correct java version",priority:"critical",order:5},
    {id:"swiftmt_t6",text:"Ensure that CFT UI is accessable and the module appears on sidebar",priority:"critical",order:6},
    {id:"swiftmt_t7",text:"Make sure that the Swift MT categories are shown in the UI section 'MT Configs', and for each SWIFT MT categories, the fields are shown when clicking on it.",priority:"critical",order:7},
    {id:"swiftmt_t8",text:"Ensure that the service run on same Java version as in UAT \"production env\"",priority:"critical",order:8},
    {id:"swiftmt_t9",text:"Make sure in the UI Swift MT section, the matching level is set HIGH \"default\" and that the lists are found in the list management as found in table SNCT_LOOKUP \"watchlist_name column\"",priority:"critical",order:9},
    {id:"swiftmt_t10",text:"Make sure that you can add free text, after accepting the case. it listened in the UI in section \"Free Text Configs\"",priority:"critical",order:10},
    {id:"swiftmt_t11",text:"Make sure that you can add MT Rules, after accepting the case. it gets listened in the UI in section \"MT-Rules\"",priority:"critical",order:11},
    {id:"swiftmt_t12",text:"Make sure that the folders \"Source, Approve, Destination, Error, Reject, Archive\"",priority:"critical",order:12},
    {id:"swiftmt_t13",text:"Run the service in order for the job and check if it prints the log correctly",priority:"major",order:13},
    {id:"swiftmt_t14",text:"Check if the request is saved in dbo.request details and message tables",priority:"major",order:14},
    {id:"swiftmt_t15",text:"Check if the data appeared in the case in UI is the similar of that found in case_live table",priority:"major",order:15},
    {id:"swiftmt_t16",text:"Check the logs \"engine, tomcat, job\" if it contains issue or not, if no case creation occurred or failure in any transaction while running the job",priority:"critical",order:16},
    {id:"swiftmt_t17",text:"Check the case,Transaction body and if the incidents are highlighted or not , Incidents and their matches, check remarks, further info, aliases, connection relationship \"still not available\", sources, key words, key data ,Case attachment ,Comments ,Case history.",priority:"major",order:17},
    {id:"swiftmt_t18",text:"Make sure that the columns \"mentioned in the BRD: Swift Reference, Message direction, amount, ....\" are shown in the ecm in order for data to be shown. Also found in the search criteria so that the client can use them while filtering",priority:"critical",order:18},
    {id:"swiftmt_t19",text:"Make sure that the status codes in the Watcher just like the ones are found when building the workflows",priority:"critical",order:19},
    {id:"swiftmt_t20",text:"Make sure that the prefix codes in the watcher.properties are like in the table SWFRM \"MTin, MTfrom\"",priority:"critical",order:20},
    {id:"swiftmt_t21",text:"Check that the workflow is working fine, and after closing the case with closed true hit or closed false hit the transaction file gets directed to the right folder",priority:"critical",order:21},
    {id:"swiftmt_t22",text:"If there was agreement with bank on production enviromnment for transactions in SOURCE, ACCEPT, REJECT to be external folders, it is a must to be simulated on UAT and monitor the job for estimate a week or 2",priority:"minor",order:22}
  ]},
  {id:"swiftmx",name:"SWIFT-MX Watcher",icon:"ti-arrows-exchange-2",color:"#185FA5",bg:"#E6F1FB",order:6,tasks:[

    {id:"swiftmx_t5",text:"Ensure that it is running on the correct java version",priority:"critical",order:5},

    {id:"swiftmx_t7",text:"Ensure that CFT UI is accessable and the module appears on sidebar",priority:"critical",order:7},

    {id:"swiftmx_t9",text:"Make sure in the UI Swift MX section, the matching level is set HIGH \"default\" and that the lists are found in the list management as found in table SNCT_LOOKUP \"watchlist_name column\"",priority:"critical",order:9},
    {id:"swiftmx_t10",text:"Make sure that you can add free text, after accepting the case. it listened in the UI in section \"Free Text Configs\"",priority:"critical",order:10},
    {id:"swiftmx_t11",text:"Make sure that you can add MX Rules, after accepting the case. it gets listened in the UI in section \"MX-Rules\"",priority:"critical",order:11},
    {id:"swiftmx_t12",text:"Make sure that the folders \"Source, Approve, Destination, Error, Reject, Archive\" are created",priority:"critical",order:12},
    {id:"swiftmx_t13",text:"Run the service in order for the job and check if it prints the log correctly",priority:"major",order:13},
    {id:"swiftmx_t14",text:"Check if the request is saved in dbo.request details and dbo.messages tables",priority:"major",order:14},
    {id:"swiftmx_t15",text:"Check if the data appeared in the case in UI is the similar of that found in case_live table",priority:"major",order:15},
    {id:"swiftmx_t16",text:"Check the logs \"engine, tomcat, job\" if it contains issue or not, if no case creation occurred or failure in any transaction while running the job",priority:"critical",order:16},
    {id:"swiftmx_t17",text:"Check the case,Transaction body and if the incidents are highlighted or not , Incidents and their matches, check remarks, further info, aliases, connection relationship \"still not available\", sources, key words, key data ,Case attachment ,Comments ,Case history.",priority:"major",order:17},
    {id:"swiftmx_t18",text:"Make sure that the columns \"mentioned in the BRD: Swift Reference, Message direction, amount, ....\" are shown in the ecm in order for data to be shown. Also found in the search criteria so that the client can use them while filtering",priority:"critical",order:18},
    {id:"swiftmx_t19",text:"Make sure that the status codes in the Watcher just like the ones are found when building the workflows",priority:"critical",order:19},
    {id:"swiftmx_t20",text:"Check that the workflow is working fine, and after closing the case with closed true hit or closed false hit the transaction file gets directed to the right folder",priority:"critical",order:20},
    {id:"swiftmx_t21",text:"If there was agreement with bank on production enviromnment for transactions in SOURCE, ACCEPT, REJECT to be external folders, it is a must to be simulated on UAT and monitor the job for estimate a week or 2",priority:"minor",order:21}
  ]},

  {id:"slagoaml",name:"SLA & GoAML",icon:"ti-clock",color:"#993556",bg:"#FBEAF0",order:14,tasks:[
    {id:"slagoaml_t0",text:"1. Add listener to user task :",priority:"minor",order:0},
    {id:"slagoaml_t1",text:"- In user task click on \u2018Execution Listeners\u2019",priority:"minor",order:1},
    {id:"slagoaml_t2",text:"- Press \u2018+\u02bc button to add listener, make event \u2018start\u2019 and put in delegate expression \u2018${escalationDelegate}\u2019",priority:"minor",order:2},
    {id:"slagoaml_t3",text:"- Then add parameters that need in escalation by click \u2018+\u02bc button like: 1- Level No.: contain number of levels. 2- TimerNamePrefix: contain the first part of timer name like \u2018DtMaker\u2018 3- Names of timers: - DtMaker1 with the time that need to fire timer after it, like after one minutes \u201900:01\u02bc - DtMaker2 with the time that need to fire timer after it, like after two minutes \u201900:02\u02bc Note: Names of timers change depend on the value of TimeNamePrefix",priority:"minor",order:3},
    {id:"slagoaml_t4",text:"- Type: to choose type of timer HM: hours and minutes like (02:30 \u2192 2 hours and 30 minutes) ND: next day like (14:20 \u2192 in the next day at 2:20 PM) Note: if you didn\u2019t add type the default is HM.",priority:"minor",order:4},
    {id:"slagoaml_t5",text:"- Accumulate Flag: to make escalation accumulate when return to the previous step or create new timer and the value of it is Boolean: True \u2192 mean accumulate work and will continue with timer. False \u2192 mean create new timer.",priority:"minor",order:5},
    {id:"slagoaml_t6",text:"Next Day: Number of days that want to skip. Note: its 24 hours, If today is 21/10/2024. Timer will fire at 23/10/2024",priority:"minor",order:6},
    {id:"slagoaml_t7",text:"- Press \u2018+\u02bc button to add listener, make event \u2018End\u2019 and put in delegate expression \u2018${escalationEndDelegate}\u02bc",priority:"minor",order:7},
    {id:"slagoaml_t8",text:"- Click \u2018Save\u2019",priority:"minor",order:8},
    {id:"slagoaml_t9",text:"2. Add timers to user task:",priority:"minor",order:9},
    {id:"slagoaml_t10",text:"- Choose from Boundary Events \u2192 Boundary timer event.",priority:"minor",order:10},
    {id:"slagoaml_t11",text:"- Then add it to user task.",priority:"minor",order:11},
    {id:"slagoaml_t12",text:"- Click on timer and add Time date in ISO-8601 with name of timer that created into escalationDelegate listener and unselect cancel activity.",priority:"minor",order:12},
    {id:"slagoaml_t13",text:"3. Add Http Task to happen when timer fire.",priority:"minor",order:13},
    {id:"slagoaml_t14",text:"- Change name of http like \u2018Email\u2019.",priority:"minor",order:14},
    {id:"slagoaml_t15",text:"- Check Asynchronous.",priority:"minor",order:15},
    {id:"slagoaml_t16",text:"- Choose request method \u2018POST\u2019",priority:"minor",order:16},
    {id:"slagoaml_t17",text:"- Add Request URL with suitable URL and template name. ${ECM_SERVER_URL}api/sendMail? TemplateType=DtMaker1",priority:"minor",order:17},
    {id:"slagoaml_t18",text:"- Add request body if you need. { \"caseRk\":${caseRk}, \"caseId\": \"${caseId}\" }",priority:"minor",order:18},
    {id:"slagoaml_t19",text:"- Add Fail status codes and Handle status codes like: 404,500,403,405,406,408.",priority:"minor",order:19},
    {id:"slagoaml_t20",text:"- Add request headers like Content-Type: application/json.",priority:"minor",order:20},
    {id:"slagoaml_t21",text:"- Uncheck the Execute parallel in same transaction.",priority:"major",order:21},
    {id:"slagoaml_t22",text:"4. In ECM:",priority:"minor",order:22},
    {id:"slagoaml_t23",text:"- From ECM Settings choose ECM Properties and add ECM_SERVER_URL with ECM URL",priority:"critical",order:23},
    {id:"slagoaml_t24",text:"- From ECM Notification choose EMAIL_TEMPLATE and ADD_NEW_EMAIL_TEMPLATE Note: Body is mandatory.",priority:"critical",order:24},
    {id:"slagoaml_t25",text:"Steps For GoAML Integration",priority:"minor",order:25},
    {id:"slagoaml_t26",text:"1. Choose from Gateways \u2192 Inclusive gateway.",priority:"minor",order:26},
    {id:"slagoaml_t27",text:"2. Add it to the workflow with flow condition \u2018${taskOutcome=='CFT-TH'}\u2019.",priority:"critical",order:27},
    {id:"slagoaml_t28",text:"3. Add Http Task:",priority:"minor",order:28},
    {id:"slagoaml_t29",text:"- Change name of http like \u2018Email\u2019.",priority:"minor",order:29},
    {id:"slagoaml_t30",text:"- Check Asynchronous.",priority:"minor",order:30},
    {id:"slagoaml_t31",text:"- Choose request method \u2018POST\u2019",priority:"minor",order:31},
    {id:"slagoaml_t32",text:"- Add Request URL with suitable URL and template name. ${ECM_SERVER_URL}api/case/send-to-queue",priority:"minor",order:32},
    {id:"slagoaml_t33",text:"- Add request body if you need. { \"queueName\": \"goaml.CFTMyClient\", \"caseRk\": ${caseRk}, \"messageHeader\": { \"caseRk\": ${caseRk}, \"reportCode\": \"SARTF\", \"X-TenantCode\": \"EG\", \"reason\": \"test\", \"createdBy\": \"${createdBy}\" } } Note: change the reportCode according to report type (SARTF, STR and DTET).",priority:"minor",order:33},
    {id:"slagoaml_t34",text:"- Add Fail status codes and Handle status codes like: 404,500,403,405,406,408.",priority:"minor",order:34},
    {id:"slagoaml_t35",text:"- Add request headers like Content-Type: application/json.",priority:"minor",order:35},
    {id:"slagoaml_t36",text:"- Uncheck the Execute parallel in same transaction.",priority:"major",order:36},
    {id:"slagoaml_t37",text:"- Add Response variable name like \u2018responseQueueMessage\u2019.",priority:"minor",order:37},
    {id:"slagoaml_t38",text:"- Add flow condition \u2018${CCR_REPORT_TYPE=='SARTF'}\u2019 and change CCR_REPORT_TYPE according to report type (SARTF, STR and DTET).",priority:"minor",order:38},
    {id:"slagoaml_t39",text:"4. In ECM:",priority:"minor",order:39},
    {id:"slagoaml_t40",text:"- From ECM Settings choose ECM Lookups, choose RT_REPORT_TYPE then add the report types. Note: This step is important because it shows the report types inside the dropdown in the case where the user picks the report type. Don\u2019t forget it!",priority:"critical",order:40},
    {id:"slagoaml_t41",text:"- The template name in Case Config will be differ in the 3 modules DELTA, ONBOARDING and CUSTBULK. (case-swf-delta-ccr.html, case-swf-onboarding-ccr.html and case-cust-bulk-ccr.html).",priority:"minor",order:41},
    {id:"slagoaml_t42",text:"5. Create a view in DGAML_NEW.target called [VW_CASE_RK_ACTIVITY_LIST]",priority:"minor",order:42}
  ]}

  checksSnap.forEach(function(checkDoc){
    var data=checkDoc.data()||{};
    var taskId=data.taskId || '';
    var shouldDelete = deleteAllChecks || targetIds.indexOf(taskId)!==-1 || targetIds.indexOf(checkDoc.id)!==-1 || (moduleId && data.moduleId===moduleId);

  });

}

async function updateModsToFirebase(moduleId, taskId) {
    if (!(await initFirebase())) {
        return false;
    }

    try {
        const batch = writeBatch(db);
        let hasPendingOps = false;

        function addModulePayload(m) {
            return {
                id: m.id,
                name: m.name,
                icon: m.icon,
                color: m.color,
                bg: m.bg,
                order: m.order
            };
        }

        function addTaskPayload(m, t) {
            return {
                id: t.id,
                moduleId: m.id,
                text: t.text,
                priority: t.priority,
                order: t.order
            };
        }

        async function upsertModule(m) {
            var moduleRef = doc(db, 'modules', m.id);
            var moduleSnap = await getDoc(moduleRef);
            var payload = addModulePayload(m);
            if (!moduleSnap.exists() || JSON.stringify(moduleSnap.data()) !== JSON.stringify(payload)) {
                batch.set(moduleRef, payload);
                hasPendingOps = true;
            }
        }

        async function upsertTask(m, t) {
            var taskRef = doc(db, 'tasks', t.id);
            var taskSnap = await getDoc(taskRef);
            var payload = addTaskPayload(m, t);
            if (!taskSnap.exists() || JSON.stringify(taskSnap.data()) !== JSON.stringify(payload)) {
                batch.set(taskRef, payload);
                hasPendingOps = true;
            }
        }

        if (moduleId) {
            var targetModule = mods.find(function (m) { return m.id === moduleId; });
            if (!targetModule) {
                return false;
            }

            await upsertModule(targetModule);

            var tasks = targetModule.tasks || [];
            if (taskId) {
                var targetTask = tasks.find(function (t) { return t.id === taskId; });
                if (targetTask) {
                    await upsertTask(targetModule, targetTask);
                }
            } else {
                for (var i = 0; i < tasks.length; i++) {
                    await upsertTask(targetModule, tasks[i]);
                }
            }
        } else {
            for (var i = 0; i < mods.length; i++) {
                var m = mods[i];
                await upsertModule(m);
                var tasks = m.tasks || [];
                for (var j = 0; j < tasks.length; j++) {
                    await upsertTask(m, tasks[j]);
                }
            }
        }

        if (hasPendingOps) {
            await batch.commit();
        }

        return true;

    } catch (e) {
        console.error('Failed to save modules', e);
        throw e;
    }
}

async function replaceModsInFirebase(newMods) {

                getDocs(collection(db, 'tasks'))
            ]);

        // Delete old modules
        modulesSnap.forEach(function (modDoc){batch.delete(modDoc.ref);});
        // Delete old tasks
        tasksSnap.forEach(function (taskDoc){batch.delete(taskDoc.ref);});
        // Delete old checks from every user
        await removeChecksForUsers(batch, [], null, true);
        
        await batch.commit();

        // Create new batch
        const batch2 = writeBatch(db);
        (newMods || []).forEach(function (m) {
          batch2.set(doc(db, 'modules', m.id),{ id: m.id, name: m.name, icon: m.icon, color: m.color, bg: m.bg, order: m.order});
          (m.tasks || []).forEach(function (t){batch2.set(doc(db, 'tasks', t.id),{id: t.id, moduleId: m.id, text: t.text, priority: t.priority, order: t.order});});
        });
        await batch2.commit();
        return true;

    } catch (e) {
        console.error('Failed to replace modules', e);
        throw e;
    }
}

async function saveChecksToFirebase(){

  try{

    Object.keys(chks).forEach(function(k){currentKeys[k]=true;});

    var sharedChecksSnap=await getDocs(collection(db,'checks'));
    sharedChecksSnap.forEach(function(cDoc){
      var cData=cDoc.data()||{};
      if(cData.userId===user.id){
        if(!currentKeys[cData.taskId]){batch.delete(cDoc.ref);}
      }
    });

    var legacyChecksSnap=await getDocs(collection(db,'users',user.id,'checks'));
    legacyChecksSnap.forEach(function(cDoc){batch.delete(doc(db,'users',user.id,'checks',cDoc.id));});

    Object.keys(chks).forEach(function(k){
      var moduleId='';
      for(var i=0;i<mods.length;i++){
        var m=mods[i];
        if((m.tasks||[]).some(function(t){return t.id===k;})){
          moduleId=m.id;
          break;
        }
      }
      var checkId=user.id+'_'+k;
      batch.set(doc(db,'checks',checkId),{id:checkId,userId:user.id,taskId:k,moduleId:moduleId,checked:!!chks[k],updatedAt:new Date().toISOString()});
    });
    await batch.commit();
  }
  catch(e){console.error('Failed to save checks',e);throw e;}
}

async function loadFromFirebase() {
    if (!(await initFirebase())) {return false;}

    try {
        const [modulesSnap, tasksSnap, usersSnap, checksSnap] =
            await Promise.all([
                getDocs(collection(db, 'modules')),
                getDocs(collection(db, 'tasks')),
                getDocs(collection(db, 'users')),
                user?getDocs(collection(db, 'checks')):Promise.resolve(null)
            ]);

        // Modules
        const fbMods = modulesSnap.docs.map(function (modDoc) {
            const modData = modDoc.data();

            return {
                id: modData.id || modDoc.id,
                name: modData.name || modDoc.id,
                icon: modData.icon || 'ti-settings',
                color: modData.color || '#185FA5',
                bg: modData.bg || '#E6F1FB',
                order: modData.order || 0,
                tasks: []
            };
        });

        // Tasks
        const groupedTasks = {};
        tasksSnap.docs.forEach(function (taskDoc) {
            const d = taskDoc.data() || {};
            const taskId = d.id || taskDoc.id;
            const moduleId = d.moduleId;

            if (!moduleId) {return;}
            if (!groupedTasks[moduleId]) {groupedTasks[moduleId] = [];}

            groupedTasks[moduleId].push({id: taskId,text: d.text,priority: d.priority,order: d.order || 0});
        });

        fbMods.forEach(function (mod) {
            mod.tasks = groupedTasks[mod.id] || [];
            mod.tasks.sort(function (a, b) {return a.order - b.order;});
        });

        if (fbMods.length) {mods = fbMods;}

        // Users
        if (!usersSnap.empty) {
            usersCache = usersSnap.docs.map(function (uDoc){return {id: uDoc.id, ...uDoc.data()};});
        }

        // Checks
        if (checksSnap) {
            const fbChecks = {};
            checksSnap.forEach(function (cDoc) {
                const cData = cDoc.data() || {};
                if (cData.userId !== user.id) {return;}
                const taskId = cData.taskId || cDoc.id;
                fbChecks[taskId] = !!cData.checked;
            });
            chks = fbChecks;
        }

        return true;

    } catch (e) {
        console.error('Firebase load failed', e);
        return false;
    }
}

function renderMod(m){

function renderTask(t,mid){

function attachModEvents(mid){
  // section toggles
  document.querySelectorAll('[data-sec]').forEach(function(h){h.addEventListener('click',function(){togSec(this.getAttribute('data-sec'));});});
  // add task buttons
  document.querySelectorAll('.atbtn').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();openForm(this.getAttribute('data-amid'),this.getAttribute('data-apt'));});});
  // checkboxes
  document.querySelectorAll('.task-check').forEach(function(c){c.addEventListener('change',function(){doChk(this.getAttribute('data-tid'),this.getAttribute('data-mid'),this.getAttribute('data-pt'));});c.addEventListener('click',function(e){e.stopPropagation();});});
  // edit/del task
  document.querySelectorAll('.tebtn').forEach(function(b){b.addEventListener('click',function(){editTask(this.getAttribute('data-mid'),this.getAttribute('data-tid'));});});
  document.querySelectorAll('.tdbtn').forEach(function(b){b.addEventListener('click',function(){delTask(this.getAttribute('data-mid'),this.getAttribute('data-tid'));});});
  // drag
  if(isAdm()){
    document.querySelectorAll('.task-item[draggable]').forEach(function(ti){
      ti.addEventListener('dragstart',function(e){drId=this.getAttribute('data-tid');drMid=this.getAttribute('data-mid');this.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      ti.addEventListener('dragover',function(e){e.preventDefault();if(this.getAttribute('data-tid')!==drId)this.classList.add('drag-over');});
      ti.addEventListener('dragleave',function(){this.classList.remove('drag-over');});
      ti.addEventListener('drop',function(e){
        e.preventDefault();this.classList.remove('drag-over');
        document.querySelectorAll('.task-item.dragging').forEach(function(x){x.classList.remove('dragging');});
        var tid2=this.getAttribute('data-tid'),mid2=this.getAttribute('data-mid');
        if(!drId||drId===tid2||drMid!==mid2)return;
        var m=gM(mid2);if(!m)return;
        var fi=m.tasks.findIndex(function(t){return t.id===drId;}),ti2=m.tasks.findIndex(function(t){return t.id===tid2;});
        if(fi<0||ti2<0)return;
        var item=m.tasks.splice(fi,1)[0];m.tasks.splice(ti2,0,item);m.tasks.forEach(function(t,i){t.order=i;});
        svMods(m.id);drId=null;render();
      });
    });
  }
}

function openForm(mid,pt,eid,etxt,epr){

  fd.style.display='';
  fd.innerHTML='<div class="inline-form"><textarea id="ftxt_'+key+'" placeholder="Task description...">'+esc(etxt)+'</textarea><div class="inline-form-row"><span style="font-size:11px;color:var(--text2);font-weight:600">Priority:</span><input type="hidden" id="fprio_'+key+'" value="'+epr+'"/>'+pbs+'<button type="button" data-fck="'+key+'" class="form-cancel fcancel">Cancel</button><button type="button" id="fsave_'+key+'" data-fmid="'+mid+'" data-fpt="'+pt+'" data-feid="'+eid+'" class="form-save" style="background:'+cfg.sc+'">'+(eid?'Save Changes':'Add Task')+'</button></div></div>';
  fd.querySelectorAll('.fpbtn').forEach(function(b){b.addEventListener('click',function(){selPr(this.getAttribute('data-fpk'),this.getAttribute('data-fpv'));});});

  var sb=el('fsave_'+key);if(sb)sb.addEventListener('click',function(){svForm(this.getAttribute('data-fmid'),this.getAttribute('data-fpt'),this.getAttribute('data-feid'));});
  var ta=el('ftxt_'+key);if(ta){ta.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter')svForm(mid,pt,eid);});setTimeout(function(){ta.focus();ta.selectionStart=ta.value.length;},30);}
}
function selPr(key,p){
  el('fprio_'+key).value=p;var cfg=PRIO[p];
  ['critical','major','minor'].forEach(function(pp){var b=document.querySelector('[data-fpk="'+key+'"][data-fpv="'+pp+'"]');if(!b)return;var pc=PRIO[pp],sel=pp===p;b.style.background=sel?pc.bbg:'transparent';b.style.color=sel?pc.bc:'var(--text2)';b.style.borderColor=sel?pc.bc:'var(--border)';});

function closeForm(key){var fd=el('form_'+key);if(fd){fd.style.display='none';fd.innerHTML='';}}
async function svForm(mid,pt,eid){
  var key=mid+'__'+pt,ta=el('ftxt_'+key),pr=el('fprio_'+key);
  var txt=ta?ta.value.trim():'';if(!txt)return;
  var prio=pr?pr.value:pt,m=gM(mid);if(!m)return;
  var savedTaskId = null;
  if(eid){var t=m.tasks.find(function(x){return x.id===eid;});if(t){t.text=txt;t.priority=prio;savedTaskId=t.id;}}
  else{var newTask={id:uniqueTaskId(m.name,m.tasks),text:txt,priority:prio,order:m.tasks.length};m.tasks.push(newTask);savedTaskId=newTask.id;}
  try{
    await updateModsToFirebase(mid, savedTaskId);
    closeForm(key);buildSB();render();
    toast(eid?'Task updated':'Task added to '+PRIO[prio].label);
  }
  catch(e){
    toast(eid?'Failed to update task':'Failed to add task','error');
  }
}
function editTask(mid,tid){var m=gM(mid);if(!m)return;var t=m.tasks.find(function(x){return x.id===tid;});if(!t)return;openForm(mid,t.priority,tid,t.text,t.priority);}
function delTask(mid,tid){var m=gM(mid);if(!m)return;var t=m.tasks.find(function(x){return x.id===tid;});if(!t)return;showConfirm('Delete Task',t.text.slice(0,80)+(t.text.length>80?'...':''),async function(){m.tasks=m.tasks.filter(function(x){return x.id!==tid;});delete chks[tid];try{await deleteTaskFromFirebase(tid);buildSB();render();updClr();toast('Task deleted');}catch(e){toast('Failed to delete task','error');}});}

function sCol(i){_eCol=i;document.querySelectorAll('.color-swatch').forEach(function(s,j){s.classList.toggle('selected',j===i);});var b=el('mmsave');if(b)b.style.background=MCOLS[i].c;}
function sIco(i){_eIco=i;document.querySelectorAll('.icon-opt').forEach(function(b){b.classList.remove('selected');b.style.borderColor='';b.style.background='';b.style.color='';});var b=document.querySelector('[data-ic="'+i+'"]');if(b){b.classList.add('selected');b.style.borderColor='#185FA5';b.style.background='#E6F1FB';b.style.color='#185FA5';}}
async function svMod(){var ni=el('modNI'),name=ni?ni.value.trim():'';if(!name){toast('Name required','error');return;}var mc=MCOLS[_eCol]||MCOLS[0];var targetModuleId=null;if(_eMod){var m=gM(_eMod);if(m){m.name=name;m.color=mc.c;m.bg=mc.bg;m.icon=_eIco;targetModuleId=m.id;}}else{var newModule={id:uniqueId(name,mods.map(function(x){return x.id;})),name:name,icon:_eIco,color:mc.c,bg:mc.bg,order:mods.length,tasks:[]};mods.push(newModule);targetModuleId=newModule.id;}try{await updateModsToFirebase(targetModuleId);closeModal();buildSB();render();toast(_eMod?'Module updated':'Module added');}catch(e){toast(_eMod?'Failed to update module':'Failed to add module','error');}}
function confDelMod(id){var m=gM(id);if(!m)return;showConfirm('Delete Module','Delete "'+m.name+'" and all '+m.tasks.length+' tasks?',async function(){m.tasks.forEach(function(t){delete chks[t.id];});mods=mods.filter(function(x){return x.id!==id;});try{await deleteModuleFromFirebase(id);page='dashboard';buildSB();render();updClr();toast('Module deleted');}catch(e){toast('Failed to delete module','error');}});}

// ── SEARCH ───────────────────────────────────────────────────────
function renderSearch(){
  var q=qry.toLowerCase().trim(),res=[];
  mods.forEach(function(m){m.tasks.forEach(function(t){if(t.text.toLowerCase().indexOf(q)>=0)res.push({m:m,t:t});});});
  function hl(s){var i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
  return '<h2 style="font-size:18px;font-weight:700;margin-bottom:4px">Search: "'+esc(qry)+'"</h2>'
    +'<p style="font-size:12px;color:var(--text2);margin-bottom:18px">'+res.length+' result'+(res.length!==1?'s':'')+' found</p>'
    +(res.length?res.map(function(r){var cfg=PRIO[r.t.priority]||PRIO.major;return'<div data-mnav="'+r.m.id+'" class="sr-item"><span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;background:'+r.m.bg+';color:'+r.m.color+';display:inline-block;margin-bottom:4px">'+esc(r.m.name)+'</span><div style="display:flex;align-items:flex-start;gap:8px"><div class="task-dot" style="background:'+cfg.dot+';margin-top:4px"></div><div style="flex:1;font-size:12.5px;color:var(--text)">'+hl(r.t.text)+'</div><span class="task-badge" style="background:'+cfg.bbg+';color:'+cfg.bc+'">'+cfg.label+'</span></div></div>';}).join(''):'<div style="text-align:center;padding:40px;color:var(--text3)">No tasks found.</div>');
}
function attachSREvents(){document.querySelectorAll('[data-mnav]').forEach(function(c){c.addEventListener('click',function(){navTo(this.getAttribute('data-mnav'));});});}

// ── MODAL ────────────────────────────────────────────────────────
function showModal(html,maxW){maxW=maxW||480;var o=el('mOverlay');if(!o){o=document.createElement('div');o.id='mOverlay';o.className='modal-overlay';document.body.appendChild(o);}o.innerHTML='<div class="modal" style="max-width:'+maxW+'px">'+html+'</div>';o.style.display='flex';o.onclick=function(e){if(e.target===o)closeModal();};}
function closeModal(){var o=el('mOverlay');if(o)o.style.display='none';}
function showConfirm(title,msg,cb,lbl){lbl=lbl||'Delete';_cb=cb;showModal('<div class="modal-hdr"><div style="display:flex;align-items:center;gap:12px"><div style="width:38px;height:38px;border-radius:8px;background:#FCEBEB;display:flex;align-items:center;justify-content:center;font-size:18px;color:#A32D2D"><i class="ti ti-alert-triangle"></i></div><span class="modal-title">'+title+'</span></div><button id="ccb" class="modal-close"><i class="ti ti-x"></i></button></div><div class="modal-body"><p style="font-size:13px;color:var(--text2);line-height:1.6">'+esc(msg)+'</p></div><div class="modal-footer"><button id="ccb2" class="btn-secondary">Cancel</button><button id="rcb" class="btn-danger">'+lbl+'</button></div>',400);
  el('ccb').addEventListener('click',closeModal);el('ccb2').addEventListener('click',closeModal);
  el('rcb').addEventListener('click',function(){if(_cb){_cb();_cb=null;}closeModal();});
}

// ── INIT ─────────────────────────────────────────────────────────
async function init(){
  theme=localStorage.getItem(THEME_KEY)||'light';applyTheme();
  // mods=cl(ORIGINAL_DATA);
  try{
    await initFirebase();
    await loadUsersFromFirebase();
    var currentUser=await loadCurrentUser();
    if(currentUser){
      var found=gUsers().find(function(x){return x.id===currentUser.id;});
      if(found){await loginUser(found);}else{showLogin();el('loginScreen').style.display='flex';el('appShell').style.display='none';}
    } else {
      showLogin();el('loginScreen').style.display='flex';el('appShell').style.display='none';
    }
  }catch(e){console.error('Initial Firebase seed failed',e);showLogin();el('loginScreen').style.display='flex';el('appShell').style.display='none';}
  // bind all static buttons via addEventListener (NO inline onclick)
  el('addUserBtn').addEventListener('click',addNewUser);
  el('newUserInput').addEventListener('keydown',function(e){if(e.key==='Enter')addNewUser();});
  el('themeBtnLogin').addEventListener('click',togTheme);
  el('themeBtn').addEventListener('click',togTheme);
  el('clearBtn').addEventListener('click',clearAllChecks);
  el('userAvatar').addEventListener('click',confLogout);
  el('searchInput').addEventListener('input',function(){qry=this.value;buildSB();render();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  var fbLoaded=false;
  try{fbLoaded=await loadFromFirebase();}catch(e){console.error(e);}
  if(!fbLoaded){
    if(mods.length){await updateModsToFirebase();}
    if(gUsers().length){await saveUsersToFirebase(gUsers(),[]);}
    if(user){buildSB();render();}
  } else if(user){
    buildSB();render();updClr();
  }
}

// Wait for DOM then init
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){init();});}else{init();}
</script>
